name: Rating Radar — команды бота

on:
  schedule:
    - cron: "*/10 * * * *"   # раз в 10 минут разбираем /start и остальные команды
  workflow_dispatch:

concurrency:
  group: radar-bot
  cancel-in-progress: false

jobs:
  poll:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt
      - name: Разобрать команды
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_BOT_TOKEN_CHILD: ${{ secrets.TELEGRAM_BOT_TOKEN_CHILD }}
          TELEGRAM_BOT_TOKEN_COMP: ${{ secrets.TELEGRAM_BOT_TOKEN_COMP }}
          TELEGRAM_BOT_TOKEN_US: ${{ secrets.TELEGRAM_BOT_TOKEN_US }}
          TELEGRAM_BOT_TOKEN_CA: ${{ secrets.TELEGRAM_BOT_TOKEN_CA }}
          TELEGRAM_BOT_TOKEN_DE: ${{ secrets.TELEGRAM_BOT_TOKEN_DE }}
          TELEGRAM_BOT_TOKEN_UK: ${{ secrets.TELEGRAM_BOT_TOKEN_UK }}
          TELEGRAM_BOT_TOKEN_FR: ${{ secrets.TELEGRAM_BOT_TOKEN_FR }}
          TELEGRAM_BOT_TOKEN_IT: ${{ secrets.TELEGRAM_BOT_TOKEN_IT }}
          TELEGRAM_BOT_TOKEN_ES: ${{ secrets.TELEGRAM_BOT_TOKEN_ES }}
        run: python -c "import notifier; print('обработано:', notifier.process_all_channels())"
